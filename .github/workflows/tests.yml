# Тесты при каждом пуше в ветку и в пулл-реквестах — те же, что build.ps1 запускает перед сборкой.
name: Тесты

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Windows, как у программы: окно Qt Quick, Direct3D 11, %LOCALAPPDATA%, поиск exe
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Зависимости
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Тесты
        run: python -m unittest discover -s tests -v
